<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>أرامكو السعودية | التسجيل</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="index.html" aria-label="الصفحة الرئيسية لأرامكو">
      <img src="assets/logo.jpg" alt="شعار أرامكو السعودية">
      <span>أرامكو السعودية</span>
    </a>
    <nav aria-label="التنقل الرئيسي">
      <a href="index.html">الرئيسية</a>
      <a class="active" href="register.html" aria-current="page">التسجيل</a>
    </nav>
  </header>
  <main class="form-page">
    <section class="form-intro">
      <p class="eyebrow">نسعد باهتمامك</p>
      <h1>نموذج التسجيل</h1>
      <p>أدخل بياناتك واختر المجالات التي تهمك.</p>
      <img src="assets/logo.jpg" alt="شعار أرامكو السعودية">
    </section>
    <form class="registration-form" action="#" method="get">
      <label for="full-name">الاسم الكامل <span>*</span></label>
      <input id="full-name" name="fullName" type="text" autocomplete="name" required>
      <label for="email">البريد الإلكتروني <span>*</span></label>
      <input id="email" name="email" type="email" autocomplete="email" required>
      <label for="phone">رقم الهاتف</label>
      <input id="phone" name="phone" type="tel" autocomplete="tel">
      <fieldset>
        <legend>نوع المشاركة <span>*</span></legend>
        <label class="choice"><input type="radio" name="participantType" value="student" required> طالب/طالبة</label>
        <label class="choice"><input type="radio" name="participantType" value="visitor"> زائر/زائرة</label>
      </fieldset>
      <fieldset>
        <legend>مجالات الاهتمام</legend>
        <label class="choice"><input type="checkbox" name="interests" value="energy"> الطاقة</label>
        <label class="choice"><input type="checkbox" name="interests" value="technology"> التقنية</label>
        <label class="choice"><input type="checkbox" name="interests" value="environment"> البيئة</label>
      </fieldset>
      <label for="purpose">الغرض من الزيارة <span>*</span></label>
      <select id="purpose" name="purpose" required>
        <option value="" selected disabled>اختر الغرض</option>
        <option value="learning">التعلم والبحث</option>
        <option value="career">التعرف على فرص العمل</option>
        <option value="general">معرفة عامة</option>
      </select>
      <button class="button" type="submit">إرسال التسجيل</button>
      <p class="form-note">الحقول التي بجانبها نجمة مطلوبة.</p>
    </form>
  </main>
  <footer><a href="index.html">→ العودة إلى الصفحة الرئيسية</a><span>أرامكو السعودية</span></footer>
</body>
</html>
